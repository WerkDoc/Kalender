<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow orb -->
  <circle cx="400" cy="120" r="130" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="120" cy="400" r="110" fill="#3b82f6" opacity="0.2" filter="url(#glow)" />

  <!-- Outer Glass Frame -->
  <rect x="56" y="56" width="400" height="400" rx="48" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Calendar Top Header Banner -->
  <path d="M 56 104 C 56 77.5 77.5 56 104 56 L 408 56 C 434.5 56 456 77.5 456 104 L 456 160 L 56 160 Z" fill="url(#headerGrad)" />

  <!-- Calendar Binder Rings -->
  <rect x="140" y="38" width="24" height="44" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="3" />
  <rect x="348" y="38" width="24" height="44" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="3" />

  <!-- Calendar Grid Dots / Lines -->
  <!-- Weekday bar indicators -->
  <rect x="96" y="196" width="320" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)" />

  <!-- Shift badges representing Day Cells -->
  <!-- Row 1: Frühschicht Badge (Golden Sun) -->
  <g transform="translate(96, 230)">
    <rect width="90" height="54" rx="16" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="2" />
    <circle cx="28" cy="27" r="10" fill="url(#sunGrad)" />
    <text x="50" y="33" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20">F</text>
  </g>

  <!-- Spätschicht Badge -->
  <g transform="translate(211, 230)">
    <rect width="90" height="54" rx="16" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="2" />
    <circle cx="28" cy="27" r="10" fill="#f97316" />
    <text x="50" y="33" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20">S</text>
  </g>

  <!-- Nachtschicht Badge -->
  <g transform="translate(326, 230)">
    <rect width="90" height="54" rx="16" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="28" cy="27" r="10" fill="url(#moonGrad)" />
    <text x="50" y="33" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20">N</text>
  </g>

  <!-- Row 2: Urlaub Badge -->
  <g transform="translate(96, 310)">
    <rect width="148" height="54" rx="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />
    <text x="24" y="33" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="18">🌴 Urlaub</text>
  </g>

  <!-- Row 2: Event Badge -->
  <g transform="translate(268, 310)">
    <rect width="148" height="54" rx="16" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="2" />
    <text x="24" y="33" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="18">📅 Termin</text>
  </g>

  <!-- Bottom Accent Sparkle -->
  <circle cx="256" cy="406" r="6" fill="#38bdf8" opacity="0.8" />
  <circle cx="236" cy="406" r="4" fill="#818cf8" opacity="0.6" />
  <circle cx="276" cy="406" r="4" fill="#c084fc" opacity="0.6" />
</svg>
